name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Playwright's image has the test browsers and their system libraries already installed; installing
    # them on each run took up to an hour when the Ubuntu package mirror was slow. Its version must match
    # @playwright/test in package-lock.json (the step below checks).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      HOME: /root # Firefox refuses to start under a home folder owned by another user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint # ESLint and Prettier (D-143)
      - run: npm test
      - run: npm run build
      - run: npm run build:server # the dedicated server bundles (D-084)
      # Browser tests on desktop and phone viewports (e2e/, Playwright).
      - name: Check the Playwright image matches the installed version
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          [ "$v" = "1.56.1" ] || { echo "Update the container image to v$v in deploy.yml"; exit 1; }
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The co-op relay (relay/, D-077): a Cloudflare Worker. Pull requests check that it typechecks and
  # bundles; master deploys it, once the game's tests have passed.
  relay:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Deploy the relay to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
