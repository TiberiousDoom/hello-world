  <g stroke="#3e4858" stroke-width="3" stroke-linecap="round"><path d="M62 92 V100 M130 92 V100" /></g>
  <path d="M39 90 A10 10 0 0 1 45 85" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" /><path d="M135 90 A10 10 0 0 1 141 85" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
