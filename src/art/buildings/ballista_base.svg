            <radialGradient id="lbDisc" cx="40%" cy="36%" r="72%"><stop offset="0" stop-color="#b9824a" /><stop offset="1" stop-color="#5e3d1d" /></radialGradient>
          </defs>
          <g filter="url(#lbSh)" stroke-linejoin="round">
