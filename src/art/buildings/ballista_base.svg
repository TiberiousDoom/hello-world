            <path d="M14 11 q6 2 12 0 M42 25 q5 2 9 0 M12 39 q5 -2 9 0 M41 53 q5 2 9 0" fill="none" stroke="#6e4a26" stroke-width="0.9" />
            <g fill="#3a3f4b"><circle cx="9" cy="12" r="1.1" /><circle cx="55" cy="12" r="1.1" /><circle cx="9" cy="52" r="1.1" /><circle cx="55" cy="52" r="1.1" /><circle cx="9" cy="25" r="1" /><circle cx="55" cy="25" r="1" /><circle cx="9" cy="39" r="1" /><circle cx="55" cy="39" r="1" /></g>
            <!-- The turntable the bow swivels on, with an iron rim -->
            <circle cx="32" cy="32" r="17" fill="url(#lbDisc)" stroke="#0f1a2e" stroke-width="2.4" />
            <circle cx="32" cy="32" r="14.8" fill="none" stroke="#3a3f4b" stroke-width="2" />
            <path d="M20.5 24 A14.8 14.8 0 0 1 32 17.2" fill="none" stroke="#8a96a8" stroke-width="1.1" stroke-linecap="round" />
            <g fill="#8a96a8"><circle cx="32" cy="19.2" r="1" /><circle cx="44.8" cy="32" r="1" /><circle cx="32" cy="44.8" r="1" /><circle cx="19.2" cy="32" r="1" /></g>
            <circle cx="32" cy="32" r="5" fill="#3a3f4b" stroke="#0f1a2e" stroke-width="1.6" />
            <circle cx="31" cy="31" r="1.6" fill="#8a96a8" />
            <!-- A few spare bolts by the edge -->
            <g stroke-linecap="round"><path d="M47 54 L56 47 M44 52 L53 45" stroke="#0f1a2e" stroke-width="3" /><path d="M47 54 L56 47 M44 52 L53 45" stroke="#d9b07a" stroke-width="1.6" /></g>
