<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs>
            <filter id="lbSh" x="-15%" y="-15%" width="140%" height="140%"><feDropShadow dx="1.5" dy="2.5" stdDeviation="1.4" flood-color="#0a1322" flood-opacity="0.55" /></filter>
