  <circle cx="96" cy="96" r="29" fill="none" stroke="#3a64a8" stroke-width="1.2" stroke-dasharray="30 152" stroke-dashoffset="-120" />
  <!-- Open at the top until the nose goes on: ribs and a ring frame inside. -->
  <circle cx="96" cy="96" r="24" fill="url(#shInside)" stroke="#0f1a2e" stroke-width="2" />
  <g stroke="#7d8a9c" stroke-width="2.2" stroke-linecap="round"><path d="M96 74 V118 M74 96 H118 M80.5 80.5 L111.5 111.5 M111.5 80.5 L80.5 111.5" /></g>
