<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs>
        <filter id="taSh" x="-15%" y="-15%" width="140%" height="140%"><feDropShadow dx="1.2" dy="2.4" stdDeviation="1.1" flood-color="#0a1322" flood-opacity="0.5" /></filter>
        <linearGradient id="taWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a86a" /><stop offset="1" stop-color="#8a5a30" /></linearGradient>
        <linearGradient id="taBox" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a6a58" /><stop offset="1" stop-color="#3e352c" /></linearGradient>
        <radialGradient id="taStone" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#e2ded4" /><stop offset="1" stop-color="#7d786e" /></radialGradient>
      </defs><g filter="url(#taSh)" stroke-linejoin="round" stroke-linecap="round">
        <!-- The two A-frame uprights either side of the arm, joined by the axle -->
        <rect x="23" y="15" width="18" height="5" rx="1.5" fill="url(#taWood)" stroke="#0f1a2e" stroke-width="1.8" />
        <rect x="23" y="44" width="18" height="5" rx="1.5" fill="url(#taWood)" stroke="#0f1a2e" stroke-width="1.8" />
        <path d="M32 15.5 V48.5" stroke="#0f1a2e" stroke-width="4" /><path d="M32 15.5 V48.5" stroke="#8a96a8" stroke-width="2" />
        <g fill="#3a3f4b" stroke="#0f1a2e" stroke-width="1"><circle cx="32" cy="17.5" r="2.2" /><circle cx="32" cy="46.5" r="2.2" /></g>
        <!-- The sling, lying back along the arm with a stone in its pouch -->
        <path d="M57 31 Q53 38 45 40.5 M57 33 Q55 41 46 43" fill="none" stroke="#0f1a2e" stroke-width="2" /><path d="M57 31 Q53 38 45 40.5 M57 33 Q55 41 46 43" fill="none" stroke="#d6bf86" stroke-width="1" />
        <path d="M41 38.5 Q44 37.5 47 40 Q48 43.5 44.5 45 Q41 45 40 42 Z" fill="#8a6a44" stroke="#0f1a2e" stroke-width="1.4" />
        <circle cx="43.5" cy="41.5" r="3.2" fill="url(#taStone)" stroke="#0f1a2e" stroke-width="1.2" />
        <circle cx="42.5" cy="40.4" r="0.9" fill="#ffffff" opacity="0.6" />
        <!-- The throwing arm: thick at the pivot, tapering to the tip -->
        <path d="M13 28.5 L32 28.2 L58 30.6 L58 33.4 L32 35.8 L13 35.5 Z" fill="url(#taWood)" stroke="#0f1a2e" stroke-width="2" />
        <path d="M15 29.8 H31 L56 31.6" fill="none" stroke="#f3d39e" stroke-width="0.9" opacity="0.9" />
        <path d="M38 32.6 q4 0.6 8 0" fill="none" stroke="#6b4426" stroke-width="0.8" />
        <g fill="none" stroke="#3a3f4b" stroke-width="1.6"><path d="M26 28 V36 M38 28.7 V35.3 M55 30.4 V33.6" /></g>
        <circle cx="58" cy="32" r="1.6" fill="#3a3f4b" stroke="#0f1a2e" stroke-width="1" />
        <!-- The counterweight: an iron-banded box of stones at the short end -->
        <rect x="3" y="21" width="15" height="22" rx="2" fill="url(#taBox)" stroke="#0f1a2e" stroke-width="2.2" />
        <path d="M3.8 27.5 H17.2 M3.8 36.5 H17.2" stroke="#2a2f3c" stroke-width="2.2" />
        <path d="M3.8 27.5 H17.2 M3.8 36.5 H17.2" stroke="#8a96a8" stroke-width="0.7" />
        <g fill="#b0aa9c" stroke="#0f1a2e" stroke-width="0.6"><circle cx="7" cy="24.2" r="1.6" /><circle cx="11" cy="24" r="1.4" /><circle cx="14.5" cy="24.4" r="1.5" /><circle cx="7.5" cy="32" r="1.5" /><circle cx="11.5" cy="31.6" r="1.7" /><circle cx="15" cy="32.2" r="1.3" /><circle cx="7" cy="39.8" r="1.4" /><circle cx="10.8" cy="40" r="1.6" /><circle cx="14.6" cy="39.6" r="1.4" /></g>
        <path d="M5 22.8 H16" stroke="#a89a88" stroke-width="0.9" opacity="0.8" />
        <!-- The pivot -->
        <circle cx="32" cy="32" r="3.6" fill="#5a6478" stroke="#0f1a2e" stroke-width="1.6" />
        <circle cx="31" cy="31" r="1.1" fill="#c9d2de" />
      </g>
      </svg>
